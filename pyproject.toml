[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hallucination-wall"
version = "1.0.0"
description = "Security guardrail that inspects autonomous AI coding agent tool invocations, blocking hallucinated or typosquatted npm/PyPI dependencies."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "OrderStream", email = "orderstream@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
ai-hallucination-wall = "ai_hallucination_wall.cli:main"
