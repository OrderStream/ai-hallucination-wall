name: "AI Hallucination Wall"
description: "Block hallucinated and typosquatted npm and PyPI packages in AI-generated PRs"
branding:
  icon: "shield-alert"
  color: "red"
inputs:
  manifest:
    description: "Path to requirements.txt or package.json to verify"
    required: false
    default: ""
  command:
    description: "Shell command string to inspect"
    required: false
    default: ""
  license_key:
    description: "OrderStream Pro/Enterprise license key (optional)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ai-hallucination-wall
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ${{ github.action_path }}
    - name: Inspect Dependencies
      shell: bash
      env:
        ORDERSTREAM_LICENSE_KEY: ${{ inputs.license_key }}
      run: |
        if [ -n "${{ inputs.command }}" ]; then
          ai-hallucination-wall check-command --cmd "${{ inputs.command }}"
        fi
        if [ -n "${{ inputs.manifest }}" ] && [ -f "${{ inputs.manifest }}" ]; then
          ai-hallucination-wall scan-manifest --file "${{ inputs.manifest }}"
        fi
